# Hosted CI: everything that needs no game data. Game tests (Q2RED harness,
# comparisons against stock) run on the self-hosted jumpbox runner from
# Phase 1b, in a separate workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_mod_markers diffs against the stock-reference tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned tools
        run: pip install -r scripts/requirements-dev.txt
      - name: Run checks
        env:
          CI: "1"
          CLANG_FORMAT: clang-format
        run: scripts/check.sh

  linux:
    # Built on Ubuntu 22.04 with GCC 12 and a static C++ runtime, so the module
    # loads on any distro with glibc 2.35 or later.
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq g++-12 cmake ninja-build git
      - uses: actions/checkout@v4
      - name: Let git read the checkout (owned by another user in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Configure
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: >-
          cmake --preset linux-release -DCMAKE_CXX_COMPILER=g++-12 -DGAME_STATIC_RUNTIME=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --build --preset linux-release
      - name: Unit tests
        run: ctest --test-dir build/linux-release --output-on-failure
      - name: Check exports and runtime dependencies
        run: |
          so=build/linux-release/game_x64.so
          exports=$(nm -D --defined-only "$so" | awk '{print $3}')
          echo "exports: $exports"
          [ "$exports" = "GetGameAPI" ] || { echo "unexpected exports"; exit 1; }
          if ldd "$so" | grep -E 'libstdc\+\+|libgcc_s'; then echo "C++ runtime not static"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: game-module-linux-x64
          path: build/linux-release/game_x64.so
          if-no-files-found: error

  rename-drill:
    # The mod's name lives only in mod.json: rebuild under a dummy name and
    # require the module to carry it and nothing of the real one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build
      - name: Rename drill
        run: scripts/rename_drill.sh

  windows:
    # The only build that ships to players: MSVC, the compiler family retail uses.
    # Ninja + cl.exe rather than MSBuild, so sccache can cache compiles; Release
    # builds carry no PDB debug info, which sccache cannot cache.
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Configure
        run: cmake --preset windows-msvc-release -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_C_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Unit tests
        run: ctest --test-dir build/windows-msvc-release --output-on-failure
      - name: Check exports
        shell: pwsh
        run: |
          $dll = "build/windows-msvc-release/game_x64.dll"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $out = & $dumpbin.FullName /exports $dll
          $out | Select-String -Pattern 'Get(C)?GameAPI'
          if (-not ($out -match '\bGetGameAPI\b') -or -not ($out -match '\bGetCGameAPI\b')) {
            Write-Error "GetGameAPI and GetCGameAPI must both be exported"; exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: game-module-windows-x64
          path: build/windows-msvc-release/game_x64.dll
          if-no-files-found: error

  changes:
    # Whether anything but docs changed: a docs-only change runs no game code,
    # so it skips the Windows game tests (game-tests.yml skips likewise).
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.diff.outputs.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "game=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -qvE '(\.md$|^docs/)'; then
            echo "game=true" >> "$GITHUB_OUTPUT"
          else
            echo "game=false" >> "$GITHUB_OUTPUT"
          fi

  windows-game-tests:
    # Runs the MSVC DLL players actually get, under Q2REX and Wine on the
    # jumpbox runner. Same-repo only; never fork code on the self-hosted box.
    needs: [windows, changes]
    if: >-
      needs.changes.outputs.game == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, q2-game-tests]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: game-module-windows-x64
          path: candidate
      - name: Fetch the stock reference DLL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . scripts/harness/pins.env
          gh release download stock-reference -R "$GITHUB_REPOSITORY" \
            -p stock-reference-game_x64.dll -D stock --clobber
          echo "$STOCK_REFERENCE_DLL_SHA256  stock/stock-reference-game_x64.dll" | sha256sum -c -
      - name: Run tiers 1-3 under Wine
        run: |
          mkdir -p harness-logs
          RIGS=$(mktemp -d /tmp/q2h-XXXX)
          echo "RIGS=$RIGS" >> "$GITHUB_ENV"
          nice python3 -I scripts/harness/q2harness.py test --engine-kind q2rex \
            --stock stock/stock-reference-game_x64.dll --candidate candidate/game_x64.dll \
            --workdir "$RIGS" --keep 2>&1 | tee harness-logs/summary.txt
          exit "${PIPESTATUS[0]}"
      - name: Collect logs
        if: always()
        run: scripts/harness/collect-logs.sh "${RIGS:-/nonexistent}" harness-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-game-test-logs
          path: harness-logs/
          retention-days: 14
