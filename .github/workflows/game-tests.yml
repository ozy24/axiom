# Game tests on the self-hosted jumpbox runner (scripts/jumpbox/). They need
# retail game data, which lives only on that box, so they can't run on hosted
# runners. Nothing that contains game data is ever uploaded: artifacts are text
# logs and save JSON only.
name: game-tests

# A change to docs alone runs no game code, so it runs no game tests.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One game-test run at a time on the box; a newer push supersedes an older one.
  group: game-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  q2red:
    # Never run code from a fork on the self-hosted runner. Same-repo PRs and
    # pushes only. Revisit before the repo goes public (plan Phase 7).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, q2-game-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the stock-reference tag must be reachable

      - name: Build candidate
        run: |
          cmake --preset linux-release >/dev/null
          nice cmake --build --preset linux-release

      - name: Build the downstream example
        # examples/jump on this base: tier 30 boots it (docs/downstream.md).
        run: |
          cmake -S examples/jump -B build/jump -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo >/dev/null
          nice cmake --build build/jump

      - name: Build stock reference
        # Unmodified id code with this repo's build system, tagged once and
        # never moved. Cached on the runner by commit.
        run: |
          . scripts/harness/pins.env
          [ "$(git rev-parse stock-reference^{commit})" = "$STOCK_REFERENCE_COMMIT" ] ||
            { echo "stock-reference tag moved; it must point at $STOCK_REFERENCE_COMMIT"; exit 1; }
          ref=$(git rev-parse --short stock-reference^{commit})
          out="$RUNNER_TOOL_CACHE/stock-reference/$ref"
          if [ ! -f "$out/game_x64.so" ]; then
            rm -rf "$out.src" && mkdir -p "$out.src"
            git archive stock-reference | tar -x -C "$out.src"
            cmake -S "$out.src" -B "$out.src/build" -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo >/dev/null
            nice cmake --build "$out.src/build"
            mkdir -p "$out" && cp "$out.src/build/game_x64.so" "$out/"
            rm -rf "$out.src"
          fi
          echo "STOCK_SO=$out/game_x64.so" >> "$GITHUB_ENV"

      - name: Run tiers 1-3
        run: |
          mkdir -p harness-logs
          RIGS=$(mktemp -d /tmp/q2h-XXXX)
          echo "RIGS=$RIGS" >> "$GITHUB_ENV"
          # Four tiers at once, each on its own ports: ~5 min instead of ~25.
          nice python3 -I scripts/harness/q2harness.py test --engine-kind q2red --jobs 4 \
            --stock "$STOCK_SO" --candidate build/linux-release/game_x64.so \
            --downstream build/jump/base/game_x64.so \
            --workdir "$RIGS" --keep 2>&1 | tee harness-logs/summary.txt
          exit "${PIPESTATUS[0]}"

      - name: Collect logs
        if: always()
        run: scripts/harness/collect-logs.sh "${RIGS:-/nonexistent}" harness-logs

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true # logs only: a full artifact quota doesn't fail passed tests
        with:
          name: game-test-logs
          path: harness-logs/
          retention-days: 14
