// Settings public servers often change. Not a file to run: copy the lines
// you want into the gametype's rulesets/<gametype>.cfg and uncomment them.

// FFA: start as soon as two players are in, with no ready-up.
// set match_ready 0

// TDM, CTF: let newcomers join a team once the match is live.
// set match_lock 0

// No Power Shield on any map, as many MuffMode servers ran.
// set g_disable_items "item_power_shield"

// No powerups (quad, invulnerability...): also a players' vote.
// set g_no_items 1
