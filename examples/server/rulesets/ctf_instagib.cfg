// rulesets/ctf_instagib.cfg: a variant of Capture The Flag. Players vote
// it as "Instagib" under Capture The Flag; `sv ruleset ctf_instagib` from
// the console. It runs after rulesets/ctf.cfg, so it holds only what
// differs, and its settings end when the mode changes.
//
// To use it, list it in server.cfg:  set g_ruleset_variants "ctf_instagib"

set g_instagib 1             // one railgun shot kills; no items
set capturelimit 5
