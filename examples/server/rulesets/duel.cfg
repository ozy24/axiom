// rulesets/duel.cfg: your changes to Duel.
//
// Without this file the server plays the built-in settings below. Each
// line is commented out at its built-in value: uncomment one and change
// it to use your own, and delete the rest if you like. Settings here
// apply whenever this gametype starts (by vote, `sv ruleset`, or
// `set g_ruleset` in server.cfg); nothing carries over from another.
// Every setting: docs/admin.md.
//
// Generated from the module's built-in rulesets
// (scripts/gen_example_rulesets.py); the map list is a suggestion.

// The rotation, and the maps a vote may pick (none built in).
set g_map_list "q2dm1 q2dm2 q2dm3 q2dm6 q2dm8"

// set match_flow 1             // warmup, countdown, live match, intermission; 0 = stock
// set match_ready 1            // everyone types `ready` to start; 0 = start once enough are in
// set match_minplayers 2       // players needed to start, bots counted
// set match_allow_no_humans 0  // 1 = bots alone may play a match (a bot server)
// set match_warmup_time 0      // seconds of warmup before starting anyway; 0 = wait
// set match_countdown 10       // seconds from all ready to the start
// set match_overtime 2         // on a tie: N-minute overtimes; -1 = sudden death; 0 = it stays tied
// set match_overtime_max 30    // still tied this many minutes into overtime: a draw; 0 = never
// set match_lock 0             // lock both teams as the match goes live
// set match_warmup_weapons 1   // warmup: every weapon the map places, full ammo
// set match_timeout 120        // seconds a timeout lasts (one per side a match); 0 = none
// set match_timeout_resume 10  // seconds of countdown back to play
// set timelimit 10             // minutes
// set fraglimit 0              // 0 = none
// set g_map_list_shuffle 1     // play g_map_list in a random order; 0 = as written
// set g_scoreboard 1           // the mod's scoreboards; 0 = stock's
// set g_frag_messages 1        // "You fragged ..." and your place, on each frag
// set g_loc 2                  // location callouts: 2 = .loc file, else the nearest item; 0 = off
