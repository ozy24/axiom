// server.cfg: your server, not its gameplay. Start the server with
// +exec server.cfg. Gameplay (limits, map lists, ready-up...) goes in
// rulesets/<gametype>.cfg instead: a mode switch replaces it.
// Every line is in force, at the module's default unless it says otherwise:
// change a value to use your own. Every setting: docs/admin.md.

set hostname "My Server"
set deathmatch 1
set maxclients 16
kexmultiplayer maxplayers 16 // the online lobby's own limit, 8 unless set: keep it equal to
                             // maxclients, or players are turned away while slots are free.
                             // "SetMaximumPlayers: Lobby not active" here is harmless: the
                             // engine keeps the number for the lobby it creates next.
set g_ruleset ffa            // the mode it starts in: ffa, duel, tdm, ctf

// Admins in the game: a player types `admin <password>` in the console.
// Use a long one, and never your rcon_password. Off while commented out.
// set admin_password ""
// set rcon_password ""

// Voting
set g_vote 1                // 0 = no votes
set g_vote_allow "map gametype restart timelimit scorelimit powerups friendlyfire readyall readyteam shuffle"
set g_vote_midgame 1        // 0 = votes in warmup only

set g_auto_join 0           // arriving players spectate with the menu open. 1 = straight into play

// A JSON record of each match, in this folder (relative to the game folder,
// e.g. "matches"). empty = none
set g_matchlog_dir ""

// How it feels and looks, on every mode (they hold across mode switches)
set g_classic_jumps 1       // original Quake II's jumps below height 0. 0 = the rerelease's
set g_teleporter_freeze 1   // 0 = out of a teleporter at speed (Quake III, MuffMode)
set g_hud_timer 1           // the match clock on the HUD. 0 = none
set g_hud_miniscore 1       // FFA and Duel: the top two, bottom right. 0 = none
set g_scoreboard 1          // the mod's scoreboards. 0 = stock's
set g_frag_messages 1       // "You fragged ..." and your place, on each frag. 0 = none
set g_loc 2                 // location callouts: 2 = .loc file, else the nearest item. 1 = .loc only. 0 = off
set match_allow_no_humans 0 // 1 = bots alone may play a match (a bot server)
set g_dm_crosshair_id 1     // TDM, CTF: a teammate's name under the crosshair. 0 = none
set g_inactivity 120        // seconds without input before a player is moved to spectate. 0 = never

// Your own modes beside the four, voted like them: rulesets/<gametype>_<name>.cfg
// (off while commented out. ctf_instagib.cfg is the example)
// set g_ruleset_variants "ctf_instagib"

map q2dm1                    // q2ctf1 if you start in ctf
