// server.cfg: your server, not its gameplay. Start the server with
// +exec server.cfg. Gameplay (limits, map lists, ready-up...) goes in
// rulesets/<gametype>.cfg instead: a mode switch replaces it.
// Every setting: docs/admin.md.

set hostname "My Server"
set deathmatch 1
set maxclients 16
set g_ruleset ffa            // the mode it starts in: ffa, duel, tdm, ctf

// Admins in the game: a player types `admin <password>` in the console.
// Use a long one, and never your rcon_password.
// set admin_password ""
// set rcon_password ""

// Voting
// set g_vote 1                // 0 = no votes
// set g_vote_allow "map gametype restart timelimit scorelimit powerups friendlyfire readyall readyteam shuffle"
// set g_vote_midgame 1        // 0 = votes in warmup only

// Arriving players spectate with the menu open; 1 = straight into play
// set g_auto_join 0

// A JSON record of each match, in this folder (relative to the game folder); empty = none
// set g_matchlog_dir "matches"

// How it feels, on every mode (they hold across mode switches)
// set g_classic_jumps 1       // original Quake II's jumps below height 0; 0 = the rerelease's
// set g_teleporter_freeze 1   // 0 = out of a teleporter at speed (Quake III, MuffMode)

// Your own modes beside the four, voted like them: rulesets/<gametype>_<name>.cfg
// set g_ruleset_variants "ctf_instagib"

map q2dm1                    // q2ctf1 if you start in ctf
